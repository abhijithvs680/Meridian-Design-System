<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css?v=2.11.1"><link rel="stylesheet" href="../bundle.css?v=2.11.1"><link rel="stylesheet" href="../expressive.css?v=2.11.1"></head>
<body>
<div class="m-stage col">
<div class="m-row"><span class="m-state-label">Variants</span><button class="m-btn m-btn-primary"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New invoice</button><button class="m-btn">Export</button><button class="m-btn m-btn-ghost">Cancel</button><button class="m-btn m-btn-agent"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.6L18.5 9.4 13.8 11.2 12 16l-1.8-4.8L5.5 9.4l4.7-1.8z"/><path d="M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"/></svg>Ask agent</button><button class="m-btn m-btn-danger">Delete</button></div>
<div class="m-row"><span class="m-state-label">Sizes</span><button class="m-btn m-btn-sm">Small</button><button class="m-btn">Medium</button><button class="m-btn m-btn-lg">Large</button><button class="m-btn m-btn-icon" aria-label="More actions"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div>
<div class="m-row"><span class="m-state-label">States</span><button class="m-btn m-btn-primary">Rest</button><button class="m-btn m-btn-primary" style="background:var(--button-primary-bg-hover)">Hover</button><button class="m-btn m-btn-primary" style="background:var(--button-primary-bg-pressed)">Pressed</button><button class="m-btn m-btn-primary" style="outline:2px solid var(--focus-ring);outline-offset:2px">Focus</button><button class="m-btn m-btn-primary" aria-busy="true"><span class="m-spinner"></span>Saving</button><button class="m-btn m-btn-primary" disabled>Disabled</button></div>
</div>
</body>
</html>
