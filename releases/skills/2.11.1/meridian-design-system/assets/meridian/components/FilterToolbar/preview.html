<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FilterToolbar — preview</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css?v=2.11.1"><link rel="stylesheet" href="../bundle.css?v=2.11.1"><link rel="stylesheet" href="../expressive.css?v=2.11.1"></head>
<body>
<div class="m-stage col">
<div class="m-filterbar"><span class="m-input-group" style="max-width:240px;height:28px"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input placeholder="Search" aria-label="Search"></span>
<button class="m-filter-chip" aria-pressed="true"><b>Status</b> Overdue <svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><button class="m-filter-chip" aria-pressed="true"><b>Region</b> South <svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><button class="m-filter-chip is-dashed"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add filter</button>
<button class="m-btn m-btn-sm m-btn-ghost" style="margin-left:auto">Clear all</button><button class="m-btn m-btn-sm m-btn-agent"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.6L18.5 9.4 13.8 11.2 12 16l-1.8-4.8L5.5 9.4l4.7-1.8z"/><path d="M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"/></svg>Filter with AI</button></div>
<ul class="m-reorder" style="max-width:420px"><li><button class="m-handle" aria-label="Reorder Status column"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></svg></button>Status</li><li class="is-dragging"><button class="m-handle" aria-label="Reorder Amount column"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></svg></button>Amount</li><li><button class="m-handle" aria-label="Reorder Due date column"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></svg></button>Due date</li></ul>
</div>
</body>
</html>
