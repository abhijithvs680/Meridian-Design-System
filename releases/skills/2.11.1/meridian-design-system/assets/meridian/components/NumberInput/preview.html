<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>NumberInput — preview</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css?v=2.11.1"><link rel="stylesheet" href="../bundle.css?v=2.11.1"><link rel="stylesheet" href="../expressive.css?v=2.11.1"></head>
<body>
<div class="m-stage col">
<div class="m-row"><span class="m-state-label">Number</span><span class="m-input-group m-stepper-input" style="width:140px"><button aria-label="Decrease">−</button><input value="12" aria-label="Quantity" inputmode="numeric"><button aria-label="Increase">+</button></span></div>
<div class="m-row"><span class="m-state-label">Money</span><span class="m-input-group" style="width:220px"><span class="m-affix is-sep">₹ INR</span><input value="1,24,500.00" aria-label="Amount" inputmode="decimal" style="text-align:right"></span></div>
<div class="m-row"><span class="m-state-label">Phone</span><span class="m-input-group" style="width:260px"><span class="m-affix is-sep">IN +91</span><input value="98450 12345" aria-label="Phone number" inputmode="tel"></span></div>
<div class="m-row"><span class="m-state-label">Percent</span><span class="m-input-group" style="width:140px"><input value="18" aria-label="GST rate" inputmode="decimal" style="text-align:right"><span class="m-affix">%</span></span></div>
</div>
</body>
</html>
