<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>BarChart — preview</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css?v=2.11.1"><link rel="stylesheet" href="../bundle.css?v=2.11.1"><link rel="stylesheet" href="../expressive.css?v=2.11.1"></head>
<body>
<div class="m-stage col">
<section class="m-card">
<div class="m-card-head"><div><h3 class="m-card-title">Revenue by channel</h3><p class="m-card-desc">Last 6 months, ₹ lakh</p></div><div class="m-legend"><span style="--c:var(--chart-1)">Direct</span><span style="--c:var(--chart-2)">Partners</span><span style="--c:var(--chart-3)">Online</span></div></div>
<div class="m-bars" role="img" aria-label="Stacked bars, May to October. Direct grows from 22 to 33 lakh, Partners from 11 to 18, Online from 6 to 13.">
<div class="m-bar"><i style="height:44px;background:var(--chart-1)"></i><i style="height:22px;background:var(--chart-2)"></i><i style="height:12px;background:var(--chart-3)"></i></div>
<div class="m-bar"><i style="height:50px;background:var(--chart-1)"></i><i style="height:24px;background:var(--chart-2)"></i><i style="height:14px;background:var(--chart-3)"></i></div>
<div class="m-bar"><i style="height:48px;background:var(--chart-1)"></i><i style="height:30px;background:var(--chart-2)"></i><i style="height:16px;background:var(--chart-3)"></i></div>
<div class="m-bar"><i style="height:56px;background:var(--chart-1)"></i><i style="height:28px;background:var(--chart-2)"></i><i style="height:20px;background:var(--chart-3)"></i></div>
<div class="m-bar"><i style="height:60px;background:var(--chart-1)"></i><i style="height:34px;background:var(--chart-2)"></i><i style="height:22px;background:var(--chart-3)"></i></div>
<div class="m-bar"><i style="height:66px;background:var(--chart-1)"></i><i style="height:36px;background:var(--chart-2)"></i><i style="height:26px;background:var(--chart-3)"></i></div>
</div>
<div class="m-axis"><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span></div>
</section></div>
</body>
</html>
