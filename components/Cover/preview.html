<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meridian</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .primary { fill:var(--primary); }
  .agent { fill:var(--agent); }
  .ink { fill:var(--fg); }
  .relief { fill:var(--fg-subtle); }
  .cut { fill:var(--bg); }
  .blk { rx:var(--radius-lg); }
  .sq { rx:var(--radius-sm); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.92; font-weight:600; letter-spacing:-.03em; color:var(--fg); }
  .tag { margin:var(--space-2) 0 0 3px; font-size:14px; line-height:20px; color:var(--fg-muted); }
</style>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css?v=2.11.1"><link rel="stylesheet" href="../bundle.css?v=2.11.1"><link rel="stylesheet" href="../expressive.css?v=2.11.1"></head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      primary 120x240 slab bled off the top (the one accent) · fg-subtle 136x176 (relief) · agent 96x96 (the AI hue, second in identity) · fg ink 200x96 bleeding off the right edge
  arrangement one tall primary slab with satellites; bottoms on one line space-12 above the edge; space-4 gutters
  pattern     tiles cut by radius-sm, some merged two-wide, from "Dense but breathable" and the 44px table rows: primary tiles on the relief block, three row bars cut from the ink block in bg
  scales      sides in space-2 multiples; gutters space-4; tile pitch space-6; corners radius-lg (blocks), radius-sm (tiles, bars)
-->
<rect class="primary blk" x="24" y="-16" width="120" height="248" rx="10"/>
<rect class="relief blk" x="160" y="56" width="136" height="176" rx="10"/>
<rect class="agent blk" x="312" y="24" width="96" height="96" rx="10"/>
<rect class="ink blk" x="312" y="136" width="200" height="96" rx="10"/>
<rect class="primary sq" x="176" y="136" width="16" height="16" rx="4"/>
<rect class="primary sq" x="200" y="136" width="16" height="16" rx="4"/>
<rect class="primary sq" x="224" y="136" width="40" height="16" rx="4"/>
<rect class="primary sq" x="272" y="136" width="16" height="16" rx="4"/>
<rect class="primary sq" x="176" y="160" width="40" height="16" rx="4"/>
<rect class="primary sq" x="224" y="160" width="16" height="16" rx="4"/>
<rect class="primary sq" x="248" y="160" width="16" height="16" rx="4"/>
<rect class="primary sq" x="272" y="160" width="16" height="16" rx="4"/>
<rect class="primary sq" x="176" y="184" width="16" height="16" rx="4"/>
<rect class="primary sq" x="200" y="184" width="40" height="16" rx="4"/>
<rect class="primary sq" x="248" y="184" width="16" height="16" rx="4"/>
<rect class="primary sq" x="272" y="184" width="16" height="16" rx="4"/>
<rect class="primary sq" x="176" y="208" width="16" height="16" rx="4"/>
<rect class="primary sq" x="200" y="208" width="16" height="16" rx="4"/>
<rect class="primary sq" x="224" y="208" width="16" height="16" rx="4"/>
<rect class="primary sq" x="248" y="208" width="40" height="16" rx="4"/>
<rect class="cut sq" x="328" y="156" width="120" height="12" rx="4"/>
<rect class="cut sq" x="328" y="180" width="88" height="12" rx="4"/>
<rect class="cut sq" x="328" y="204" width="136" height="12" rx="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">Meridian</h1>
<p class="tag">Calm, dense, and honest about what the agent did.</p>
</div>
</div>
</body>
</html>
