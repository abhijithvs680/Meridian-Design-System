<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ButtonGroup — preview</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css?v=2.11.1"><link rel="stylesheet" href="../bundle.css?v=2.11.1"><link rel="stylesheet" href="../expressive.css?v=2.11.1"></head>
<body>
<div class="m-stage col">
<div class="m-row"><span class="m-state-label">Group</span><div class="m-btn-group" role="group" aria-label="View"><button class="m-btn" aria-pressed="true">Day</button><button class="m-btn" aria-pressed="false">Week</button><button class="m-btn" aria-pressed="false">Month</button></div></div>
<div class="m-row"><span class="m-state-label">Split</span><div class="m-btn-group is-split is-primary"><button class="m-btn">Save and send</button><button class="m-btn" aria-label="More save options" aria-haspopup="menu"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div><div class="m-btn-group is-split"><button class="m-btn"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Export CSV</button><button class="m-btn" aria-label="More export formats" aria-haspopup="menu"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div></div>
<div class="m-row"><span class="m-state-label">Copy</span><button class="m-btn m-btn-sm"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>Copy invite link</button><button class="m-btn m-btn-sm is-copied" aria-live="polite"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Copied</button></div>
<div class="m-row"><span class="m-state-label">Hold</span><button class="m-btn m-btn-danger m-hold" style="--p:55%"><i></i><span>Hold to delete workspace</span></button></div>
</div>
</body>
</html>
