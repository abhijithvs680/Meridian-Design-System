<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TextField — preview</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css?v=2.11.1"><link rel="stylesheet" href="../bundle.css?v=2.11.1"><link rel="stylesheet" href="../expressive.css?v=2.11.1"></head>
<body>
<div class="m-stage col">
<div class="m-row" style="align-items:flex-start">
<label class="m-field"><span class="m-label">Customer name</span><input class="m-input" placeholder="Acme Healthcare Pvt Ltd"><span class="m-help">As it appears on the tax registration.</span></label>
<label class="m-field is-error"><span class="m-label">Tax ID</span><input class="m-input" value="29ABCDE1234" aria-invalid="true"><span class="m-help">Tax ID must be 15 characters.</span></label>
</div>
<div class="m-row" style="align-items:flex-start">
<label class="m-field"><span class="m-label">Invoice number</span><input class="m-input" value="INV-2041" readonly><span class="m-help">Read-only: generated on save.</span></label>
<label class="m-field"><span class="m-label">Branch</span><input class="m-input" value="Bengaluru" disabled></label>
</div>
<label class="m-field"><span class="m-label">Notes <small>(optional)</small></span><textarea class="m-textarea" placeholder="Payment terms, PO reference…"></textarea></label>
</div>
</body>
</html>
