<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ShareAccess — preview</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css?v=2.11.1"><link rel="stylesheet" href="../bundle.css?v=2.11.1"><link rel="stylesheet" href="../expressive.css?v=2.11.1"></head>
<body>
<div class="m-stage">
<div class="m-popover" style="width:380px;padding:16px">
<div class="m-dialog-title" style="margin-bottom:12px">Share "Collections overview"</div>
<div style="display:flex;gap:8px;margin-bottom:12px"><span class="m-input-group"><input placeholder="Add people, teams or emails" aria-label="Add people"></span><button class="m-btn m-btn-primary">Invite</button></div>
<div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:10px"><span class="m-avatar m-avatar-sm">AB</span><span style="flex:1">You<div class="m-help">Owner</div></span></div>
<div style="display:flex;align-items:center;gap:10px"><span class="m-avatar m-avatar-sm">PK</span><span style="flex:1">Priya Kumar<div class="m-help">priya@yourco.in</div></span><select class="m-select" style="width:110px;height:28px" aria-label="Priya's access"><option>Can edit</option><option>Can view</option></select></div>
<div style="display:flex;align-items:center;gap:10px"><span class="m-agent-avatar" style="width:24px;height:24px"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.6L18.5 9.4 13.8 11.2 12 16l-1.8-4.8L5.5 9.4l4.7-1.8z"/><path d="M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"/></svg></span><span style="flex:1">Billing agent<div class="m-help">Read-only, can propose changes</div></span><span class="m-badge m-badge-agent">Agent</span></div>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)"><span class="m-help"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg> Only invited people</span><button class="m-btn m-btn-sm"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Copy link</button></div>
</div></div>
</body>
</html>
