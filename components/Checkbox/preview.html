<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkbox — preview</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css?v=2.11.1"><link rel="stylesheet" href="../bundle.css?v=2.11.1"><link rel="stylesheet" href="../expressive.css?v=2.11.1"></head>
<body>
<div class="m-stage col">
<div class="m-row"><span class="m-state-label">Checkbox</span><label class="m-check"><input type="checkbox" checked>Send copy to customer</label><label class="m-check"><input type="checkbox">Attach PDF</label><label class="m-check"><input type="checkbox" id="ind">Select all</label><label class="m-check"><input type="checkbox" disabled>Locked</label></div>
<div class="m-row"><span class="m-state-label">Radio</span><label class="m-check"><input type="radio" name="t" checked>Net 15</label><label class="m-check"><input type="radio" name="t">Net 30</label><label class="m-check"><input type="radio" name="t">Net 45</label></div>
<div class="m-row"><span class="m-state-label">Switch</span><label class="m-switch"><input type="checkbox" role="switch" checked>Auto-send reminders</label><label class="m-switch"><input type="checkbox" role="switch">Require approval</label><label class="m-switch"><input type="checkbox" role="switch" disabled>Disabled</label></div>
</div>
<script>document.getElementById('ind').indeterminate = true;</script>
</body>
</html>
